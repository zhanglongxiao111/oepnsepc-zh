name: spec-driven
version: 1
description: 默认 OpenSpec 工作流 - 提案 → 规范 → 设计 → 任务
artifacts:
  - id: proposal
    generates: proposal.md
    description: 概述变更的初始提案文档
    template: proposal.md
    instruction: |
      创建提案文档，说明为什么需要此变更。

      章节：
      - **Why**: 用 1-2 句话描述问题或机会。解决了什么问题？为什么是现在？
      - **What Changes**: 变更的项目列表。具体说明新功能、修改或移除的内容。标记破坏性变更为 **BREAKING**。
      - **Capabilities**: 确定将创建或修改哪些规范：
        - **New Capabilities**: 列出将引入的功能。每个功能创建一个新的 `specs/<name>/spec.md`。使用 kebab-case 命名（例如 `user-auth`、`data-export`）。
        - **Modified Capabilities**: 列出需求正在变更的现有功能。仅在规范级别的行为发生变化时才包含（而非仅实现细节）。每个需要一个增量规范文件。检查 `openspec/specs/` 中的现有规范名称。如果没有需求变更则留空。
      - **Impact**: 受影响的代码、API、依赖或系统。

      重要：Capabilities 章节至关重要。它创建了提案阶段与规范阶段之间的契约。
      在填写之前请先研究现有规范。
      此处列出的每个功能都需要相应的规范文件。

      保持简洁（1-2 页）。专注于"为什么"而非"怎么做" -
      实现细节属于 design.md。

      这是基础 - 规范、设计和任务都建立在此之上。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 变更的详细规范
    template: spec.md
    instruction: |
      创建定义系统应该做什么的规范文件。

      根据提案的 Capabilities 章节，为每个功能创建一个规范文件。
      - 新功能：使用提案中的 kebab-case 名称（specs/<capability>/spec.md）。
      - 修改的功能：创建增量规范时使用 openspec/specs/<capability>/ 中的现有规范文件夹名称。

      增量操作（使用 ## 标题）：
      - **ADDED Requirements**: 新功能
      - **MODIFIED Requirements**: 变更的行为 - 必须包含完整的更新内容
      - **REMOVED Requirements**: 废弃的功能 - 必须包含 **Reason** 和 **Migration**
      - **RENAMED Requirements**: 仅名称变更 - 使用 FROM:/TO: 格式

      格式要求：
      - 每个需求：`### Requirement: <name>` 后跟描述
      - 使用 SHALL/MUST 表示规范性需求（避免 should/may）
      - 每个场景：`#### Scenario: <name>` 使用 WHEN/THEN 格式
      - **关键**：场景必须使用 4 个井号（`####`）。使用 3 个井号或项目符号将静默失败。
      - 每个需求必须至少有一个场景。

      MODIFIED 需求工作流：
      1. 在 openspec/specs/<capability>/spec.md 中找到现有需求
      2. 复制整个需求块（从 `### Requirement:` 到所有场景）
      3. 粘贴到 `## MODIFIED Requirements` 下并编辑以反映新行为
      4. 确保标题文本完全匹配（对空白不敏感）

      常见陷阱：使用 MODIFIED 但内容不完整会在归档时丢失细节。
      如果添加新关注点而不改变现有行为，请使用 ADDED。

      示例：
      ```
      ## ADDED Requirements

      ### Requirement: 用户可以导出数据
      系统 SHALL 允许用户以 CSV 格式导出数据。

      #### Scenario: 成功导出
      - **WHEN** 用户点击"导出"按钮
      - **THEN** 系统下载包含所有用户数据的 CSV 文件

      ## REMOVED Requirements

      ### Requirement: 旧版导出
      **Reason**: 被新导出系统替代
      **Migration**: 使用新的导出端点 /api/v2/export
      ```

      规范应该是可测试的 - 每个场景都是一个潜在的测试用例。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 包含实现细节的技术设计文档
    template: design.md
    instruction: |
      创建解释如何实现变更的设计文档。

      何时包含 design.md（仅在以下任一情况时创建）：
      - 跨模块变更（多个服务/模块）或新的架构模式
      - 新的外部依赖或重大数据模型变更
      - 安全、性能或迁移复杂性
      - 编码前需要技术决策来消除歧义

      章节：
      - **Context**: 背景、当前状态、约束、利益相关者
      - **Goals / Non-Goals**: 此设计实现的目标和明确排除的内容
      - **Decisions**: 关键技术选择及其理由（为什么选 X 而非 Y？）。包括每个决策考虑的替代方案。
      - **Risks / Trade-offs**: 已知限制、可能出错的地方。格式：[风险] → 缓解措施
      - **Migration Plan**: 部署步骤、回滚策略（如适用）
      - **Open Questions**: 待解决的决策或未知问题

      专注于架构和方法，而非逐行实现。
      参考提案了解动机，参考规范了解需求。

      好的设计文档解释技术决策背后的"为什么"。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 包含可跟踪任务的实现清单
    template: tasks.md
    instruction: |
      创建分解实现工作的任务列表。

      **重要：请严格按照以下模板操作。** apply 阶段会解析
      复选框格式以跟踪进度。不使用 `- [ ]` 的任务将不会被跟踪。

      指南：
      - 用 ## 编号标题对相关任务分组
      - 每个任务必须是复选框：`- [ ] X.Y 任务描述`
      - 任务应小到可以在一次会话中完成
      - 按依赖顺序排列任务（什么必须先做？）

      示例：
      ```
      ## 1. 准备工作

      - [ ] 1.1 创建新的模块结构
      - [ ] 1.2 将依赖添加到 package.json

      ## 2. 核心实现

      - [ ] 2.1 实现数据导出功能
      - [ ] 2.2 添加 CSV 格式化工具
      ```

      参考规范了解需要构建什么，参考设计了解如何构建。
      每个任务应是可验证的 - 你知道何时完成。
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    阅读上下文文件，逐步完成待办任务，完成后标记为已完成。
    如遇到阻碍或需要澄清，请暂停。
