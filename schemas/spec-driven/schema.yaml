name: spec-driven
version: 1
description: 默认 OpenSpec 工作流 - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: 描述变更的初始提案文档
    template: proposal.md
    instruction: |
      创建确立此变更必要性原因的提案文档。

      章节：
      - **Why**: 1-2 句话说明问题或机会。这解决什么问题？为什么是现在？
      - **What Changes**: 变更项目符号列表。具体说明新能力、修改或移除。用 **BREAKING** 标记破坏性变更。
      - **Impact**: 两部分：
        - 受影响的规范：列出将有规范 delta 的能力
        - 受影响的代码：关键文件、API、依赖项或系统

      保持简洁（1-2 页）。专注于"为什么"而不是"如何" -
      实现细节属于 design.md。

      这是基础 - 规范、设计和任务都基于此构建。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 变更的详细规范
    template: spec.md
    instruction: |
      创建定义系统应该做什么的规范文件。

      在 specs/<name>/spec.md 中为每个能力/功能区域创建一个规范文件。

      Delta 操作（使用 ## 标题）：
      - **ADDED Requirements**: 新能力
      - **MODIFIED Requirements**: 变更的行为 - 必须包含完整的更新内容
      - **REMOVED Requirements**: 已弃用的功能 - 必须包含 **Reason** 和 **Migration**
      - **RENAMED Requirements**: 仅名称变更 - 使用 FROM:/TO: 格式

      格式要求：
      - 每个需求：`### Requirement: <名称>` 后跟描述
      - 对规范性需求使用 SHALL/MUST（避免使用 should/may）
      - 每个场景：`#### Scenario: <名称>` 使用 WHEN/THEN 格式
      - **关键**: 场景必须精确使用 4 个井号 (`####`)。使用 3 个井号或项目符号将静默失败。
      - 每个需求必须至少有一个场景。

      MODIFIED 需求工作流：
      1. 在 openspec/specs/<capability>/spec.md 中找到现有需求
      2. 复制整个需求块（从 `### Requirement:` 到所有场景）
      3. 粘贴到 `## MODIFIED Requirements` 下并编辑以反映新行为
      4. 确保标题文本完全匹配（不区分空格）

      常见陷阱：使用 MODIFIED 但内容不完整会在归档时丢失细节。
      如果添加新内容而不更改现有行为，请改用 ADDED。

      示例：
      ```
      ## ADDED Requirements

      ### Requirement: 用户可以导出数据
      系统 SHALL 允许用户以 CSV 格式导出其数据。

      #### Scenario: 成功导出
      - **WHEN** 用户点击"导出"按钮
      - **THEN** 系统下载包含所有用户数据的 CSV 文件

      ## REMOVED Requirements

      ### Requirement: 旧版导出
      **Reason**: 被新导出系统替代
      **Migration**: 使用新导出端点 /api/v2/export
      ```

      规范应该是可测试的 - 每个场景都是潜在的测试用例。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 包含实现细节的技术设计文档
    template: design.md
    instruction: |
      创建解释如何实现变更的设计文档。

      何时包含 design.md（仅在以下任一情况适用时创建）：
      - 跨领域变更（多个服务/模块）或新的架构模式
      - 新的外部依赖或重大数据模型变更
      - 安全性、性能或迁移复杂性
      - 在编码之前需要技术决策的歧义

      章节：
      - **Context**: 背景、当前状态、约束、利益相关者
      - **Goals / Non-Goals**: 此设计实现什么以及明确排除什么
      - **Decisions**: 关键技术选择及其理由（为什么选 X 而不是 Y？）。每个决策都包含考虑的替代方案。
      - **Risks / Trade-offs**: 已知限制，可能出错的事情。格式：[风险] → 缓解措施
      - **Migration Plan**: 部署步骤，回滚策略（如适用）
      - **Open Questions**: 待解决的决策或未知数

      专注于架构和方法，而不是逐行实现。
      引用提案了解动机，引用规范了解需求。

      好的设计文档解释技术决策背后的"为什么"。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 从规范和设计派生的实施任务
    template: tasks.md
    instruction: |
      创建分解实施工作的任务列表。

      指南：
      - 将相关任务分组在 ## 编号标题下
      - 每个任务是一个复选框：- [ ] X.Y 任务描述
      - 任务应该足够小，可以在一个会话中完成
      - 按依赖关系排序任务（什么必须先完成？）

      示例：
      ```
      ## 1. 设置

      - [ ] 1.1 创建新模块结构
      - [ ] 1.2 将依赖项添加到 package.json

      ## 2. 核心实现

      - [ ] 2.1 实现数据导出函数
      - [ ] 2.2 添加 CSV 格式化工具
      ```

      引用规范了解需要构建什么，引用设计了解如何构建。
      每个任务应该是可验证的 - 你知道它何时完成。
    requires:
      - specs
      - design
